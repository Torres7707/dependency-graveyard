<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Status Icons</title>
<style>
:root{--ink-night:#0d0b14;--plum-dusk:#2a1b3d;--bone:#e8e0cc;--stone:#8a8597}
body{margin:0;background:radial-gradient(ellipse at 50% 0,var(--plum-dusk),var(--ink-night) 70%);color:var(--bone);font-family:Georgia,"Songti SC",serif;min-height:100vh;padding:32px 16px;box-sizing:border-box}
h1{text-align:center;font-weight:normal;letter-spacing:.08em;margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;max-width:1100px;margin:0 auto}
figure{margin:0;padding:20px 12px;border:1px solid #4b3a6b;border-radius:12px;background:rgba(13,11,20,.5);text-align:center}
img{width:128px;height:128px;display:block;margin:0 auto 12px}
.sizes{display:flex;justify-content:center;gap:10px;align-items:end;margin-top:10px}
.sizes img{margin:0}
figcaption b{display:block;font-size:18px}
figcaption span{color:var(--stone);font-size:14px}
</style></head><body>
<h1>Dependency Graveyard · 状态图标</h1>
<div class="grid">
<figure><img src="../src/assets/status/alive.svg" alt=""><figcaption><b>alive 守夜人</b><span>烛火摇曳、光晕呼吸</span></figcaption><div class="sizes"><img src="../src/assets/status/alive.svg" style="width:48px;height:48px" alt=""><img src="../src/assets/status/alive.svg" style="width:24px;height:24px" alt=""></div></figure>
<figure><img src="../src/assets/status/zombie.svg" alt=""><figcaption><b>zombie 行尸</b><span>破土、摇摆、手指抓握</span></figcaption><div class="sizes"><img src="../src/assets/status/zombie.svg" style="width:48px;height:48px" alt=""><img src="../src/assets/status/zombie.svg" style="width:24px;height:24px" alt=""></div></figure>
<figure><img src="../src/assets/status/ghost.svg" alt=""><figcaption><b>ghost 游魂</b><span>漂浮、裙摆飘动、眼神游移</span></figcaption><div class="sizes"><img src="../src/assets/status/ghost.svg" style="width:48px;height:48px" alt=""><img src="../src/assets/status/ghost.svg" style="width:24px;height:24px" alt=""></div></figure>
<figure><img src="../src/assets/status/buried.svg" alt=""><figcaption><b>buried 长眠者</b><span>枯藤生长、乌鸦歪头</span></figcaption><div class="sizes"><img src="../src/assets/status/buried.svg" style="width:48px;height:48px" alt=""><img src="../src/assets/status/buried.svg" style="width:24px;height:24px" alt=""></div></figure>
<figure><img src="../src/assets/status/lost.svg" alt=""><figcaption><b>lost 无名冢</b><span>问号鬼火缓慢飘移</span></figcaption><div class="sizes"><img src="../src/assets/status/lost.svg" style="width:48px;height:48px" alt=""><img src="../src/assets/status/lost.svg" style="width:24px;height:24px" alt=""></div></figure>
</div></body></html>
