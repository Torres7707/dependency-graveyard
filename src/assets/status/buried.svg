<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="buried-title">
  <title id="buried-title">Buried: a leaning tombstone with a crow</title>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .buried-vine { animation: buried-vine 1.4s ease-out .2s both; }
      .buried-leaf { animation: buried-leaf .4s ease-out both; }
      .buried-head { transform-box: view-box; transform-origin: 33.5px 10px; animation: buried-tilt 6s ease-in-out 1.6s infinite; }
      .buried-wing { transform-box: view-box; transform-origin: 36px 11px; animation: buried-ruffle 7s ease-in-out 2.4s infinite; }
      .buried-dust { animation: buried-dust 5s ease-out infinite; }
      @keyframes buried-vine {
        from { stroke-dashoffset: 1; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes buried-leaf {
        from { opacity: 0; transform: scale(.3); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes buried-tilt {
        0%, 62%, 100% { transform: rotate(0deg); }
        68%, 82% { transform: rotate(-16deg); }
        88% { transform: rotate(4deg); }
      }
      @keyframes buried-ruffle {
        0%, 40%, 100% { transform: rotate(0deg); }
        43% { transform: rotate(-14deg); }
        46% { transform: rotate(2deg); }
        49% { transform: rotate(-10deg); }
        53% { transform: rotate(0deg); }
      }
      @keyframes buried-dust {
        0% { opacity: 0; transform: translate(0, 0); }
        20% { opacity: .7; }
        100% { opacity: 0; transform: translate(-3px, -7px); }
      }
    }
  </style>

  <g class="buried-stone" transform="rotate(6 32 58)">
    <path d="M18 60 L18 31 Q18 18 32 18 Q46 18 46 31 L46 60 Z" fill="#8a8597"/>
    <path d="M40 20.2 Q46 23.5 46 31 L46 60 L41 60 Z" fill="#6e6a7c"/>
    <path d="M21.5 30 Q22 22.5 28 20.6" fill="none" stroke="#a9a4b5" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M30 29 V45 M25 34 H35" stroke="#a9a4b5" stroke-width="1" stroke-linecap="round" transform="translate(.7 .7)"/>
    <path d="M30 29 V45 M25 34 H35" stroke="#57536a" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M44 24 L40.5 29 L42.8 32 L39.5 37.5" fill="none" stroke="#1a1424" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 60 L18 31 Q18 18 32 18 Q46 18 46 31 L46 60" fill="none" stroke="#1a1424" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="22" cy="55.5" rx="3.4" ry="1.7" fill="#5c6b34"/>
    <ellipse cx="25.5" cy="57" rx="2" ry="1.1" fill="#6f7f40"/>

    <path class="buried-vine" d="M21 61 C17 54 24 50 21.5 44 C19 38 26.5 34 24.5 27" fill="none" stroke="#6b5a3a" stroke-width="1.8" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/>
    <g fill="#8a7a3e" stroke="#1a1424" stroke-width=".7">
      <path class="buried-leaf" d="M20.8 51 q-4 -2.4 -6 .8 q3.2 2 6 -.8 z" style="animation-delay:.6s"/>
      <path class="buried-leaf" d="M22.6 40 q4 -2.6 6.2 .4 q-3.2 2.2 -6.2 -.4 z" style="animation-delay:.95s"/>
      <path class="buried-leaf" d="M24.6 30.5 q-3.6 -3 -6 -.2 q2.8 2.6 6 .2 z" style="animation-delay:1.3s"/>
    </g>
  </g>

  <g class="buried-crow">
    <path d="M36.6 17 L35.6 18.6 M39.6 17 L39.1 19" stroke="#b39b5a" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M43 13 L51.5 16.5 L50.5 12.5 Z" fill="#2b2238" stroke="#6a5590" stroke-width="1.2" stroke-linejoin="round"/>
    <ellipse cx="38.5" cy="12.5" rx="7" ry="4.8" fill="#2b2238" stroke="#6a5590" stroke-width="1.2"/>
    <path class="buried-wing" d="M35 10.5 Q41 7.5 45.5 12 Q41 15.5 35 13.5 Z" fill="#3a2e4d" stroke="#6a5590" stroke-width="1" stroke-linejoin="round"/>
    <g class="buried-head">
      <path d="M29 6.6 L24.2 8.2 L29 9.4 Z" fill="#b39b5a" stroke="#1a1424" stroke-width=".8" stroke-linejoin="round"/>
      <circle cx="32.5" cy="7.5" r="4.2" fill="#2b2238" stroke="#6a5590" stroke-width="1.2"/>
      <circle cx="31.6" cy="6.6" r="1.25" fill="#e8e0cc"/>
      <circle cx="31.2" cy="6.6" r=".55" fill="#1a1424"/>
    </g>
  </g>

  <path d="M-1 65 L-1 61 Q10 55 22 57.5 Q32 54.5 42 57.5 Q54 55 65 61 L65 65 Z" fill="#5a4636" stroke="#1a1424" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#7a604a">
    <circle cx="10" cy="61" r=".9"/>
    <circle cx="28" cy="60" r="1"/>
    <circle cx="47" cy="61.5" r=".8"/>
  </g>
  <path d="M51 58.5 Q51.5 53.5 54.5 51.6" fill="none" stroke="#6b5a3a" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="55" cy="52" r="1.8" fill="#8a6f3e" stroke="#1a1424" stroke-width=".8"/>
  <g fill="#8a7a66">
    <circle class="buried-dust" cx="14" cy="57" r="1.4" opacity="0"/>
    <circle class="buried-dust" cx="45" cy="56.5" r="1.1" opacity="0" style="animation-delay:2.5s"/>
  </g>
</svg>
