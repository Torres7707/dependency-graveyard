<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="alive-title">
  <title id="alive-title">Alive: a candle burning on a jack-o'-lantern</title>
  <defs>
    <radialGradient id="alive-halo-grad">
      <stop offset="0" stop-color="#f2b950" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#f2b950" stop-opacity=".2"/>
      <stop offset="1" stop-color="#f2b950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="alive-pumpkin-grad" cx=".42" cy=".32" r=".8">
      <stop offset="0" stop-color="#f39445"/>
      <stop offset="1" stop-color="#b4501e"/>
    </radialGradient>
    <radialGradient id="alive-lobe-grad" cx=".5" cy=".35" r=".8">
      <stop offset="0" stop-color="#e07a34"/>
      <stop offset="1" stop-color="#9c4319"/>
    </radialGradient>
    <filter id="alive-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <g id="alive-face">
      <path d="M21 42 L25.5 35.5 L29 42 Z"/>
      <path d="M35 42 L38.5 35.5 L43 42 Z"/>
      <path d="M30.5 46 L32 43.5 L33.5 46 Z"/>
      <path d="M20 48 Q32 58 44 48 Q41.5 50.5 39.5 49.5 L37.8 52.2 L35.2 50.2 L32 52.8 L28.8 50.2 L26.2 52.2 L24.5 49.5 Q22.5 50.5 20 48 Z"/>
    </g>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .alive-flame { transform-box: view-box; transform-origin: 32px 18.5px; animation: alive-flicker 1.3s ease-in-out infinite; }
      .alive-halo { transform-box: view-box; transform-origin: 32px 14px; animation: alive-breathe 2.6s ease-in-out infinite; }
      .alive-glow { animation: alive-glow 1.3s ease-in-out infinite; }
      .alive-spark { animation: alive-spark 2.6s ease-out infinite; }
      @keyframes alive-flicker {
        0%, 100% { transform: scale(1, 1) skewX(0deg); }
        20% { transform: scale(.95, 1.07) skewX(-4deg); }
        45% { transform: scale(1.04, .93) skewX(3deg); }
        70% { transform: scale(.97, 1.09) skewX(-1.5deg); }
      }
      @keyframes alive-breathe {
        0%, 100% { opacity: .7; transform: scale(.92); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes alive-glow {
        0%, 100% { opacity: 1; }
        30% { opacity: .7; }
        60% { opacity: .92; }
      }
      @keyframes alive-spark {
        0% { opacity: 0; transform: translateY(0); }
        15% { opacity: 1; }
        100% { opacity: 0; transform: translateY(-9px); }
      }
    }
  </style>

  <circle class="alive-halo" cx="32" cy="14" r="16" fill="url(#alive-halo-grad)"/>

  <g class="alive-candle">
    <rect x="28.5" y="19" width="7" height="14" rx="1.5" fill="#e8e0cc" stroke="#1a1424" stroke-width="2"/>
    <path d="M29.5 20 H34.5 V22 Q34.5 24 33.6 24 Q32.6 24 32.6 22.6 Q32.2 21.6 31.2 22 V23.6 Q31.2 25 30.3 25 Q29.5 25 29.5 23.6 Z" fill="#fff8e6"/>
    <line x1="32" y1="19" x2="32" y2="16.5" stroke="#1a1424" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <g class="alive-pumpkin" stroke="#1a1424" stroke-width="2">
    <ellipse cx="21.5" cy="46" rx="11.5" ry="13" fill="url(#alive-lobe-grad)"/>
    <ellipse cx="42.5" cy="46" rx="11.5" ry="13" fill="url(#alive-lobe-grad)"/>
    <ellipse cx="32" cy="45" rx="10.5" ry="14" fill="url(#alive-pumpkin-grad)"/>
  </g>
  <path d="M36 31 Q40.5 26.5 44 29.5" fill="none" stroke="#5c6b34" stroke-width="2" stroke-linecap="round"/>

  <g class="alive-glow">
    <use href="#alive-face" xlink:href="#alive-face" fill="#ffb84d" filter="url(#alive-blur)"/>
    <use href="#alive-face" xlink:href="#alive-face" fill="#ffd77a" stroke="#1a1424" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <g class="alive-flame">
    <path d="M32 2 C36 7.5 37.5 10.5 37.5 13 A5.5 5.5 0 0 1 26.5 13 C26.5 10.5 28 7.5 32 2 Z" fill="#f29a3a"/>
    <path d="M32 6 C34.8 9.8 35.6 11.6 35.6 13.6 A3.6 3.6 0 0 1 28.4 13.6 C28.4 11.6 29.2 9.8 32 6 Z" fill="#f2b950"/>
    <path d="M32 10 C33.4 12 33.8 13 33.8 14.2 A1.8 1.8 0 0 1 30.2 14.2 C30.2 13 30.6 12 32 10 Z" fill="#fff3c4"/>
  </g>

  <g fill="#ffd77a">
    <circle class="alive-spark" cx="28.5" cy="9" r=".9" opacity="0"/>
    <circle class="alive-spark" cx="35.5" cy="7" r=".8" opacity="0" style="animation-delay:.9s"/>
    <circle class="alive-spark" cx="31" cy="4" r=".7" opacity="0" style="animation-delay:1.7s"/>
  </g>
</svg>
