<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dependency Graveyard</title>
<meta name="description" content="粘贴 package.json，依赖化作墓园：谁活着，谁是僵尸，谁是幽灵，谁已入土。" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+SC:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Dependency Graveyard — dark-fairytale gothic
   World: a witch's cathedral cemetery at midnight. Stained glass,
          candle gold, ruby rose, spectral teal, moss, ash.
   Type:  UnifrakturMaguntia (blackletter title only)
          Cormorant Garamond + Noto Serif SC (everything readable)
          JetBrains Mono (only for the pasted JSON)
   Memorable thing: the rose window crowning the title, and the
          four illustrated, animated grave states.
   ============================================================ */
:root {
  --void: #0c0812;
  --night: #160e22;
  --nave: #23163a;
  --plum: #36204f;
  --vellum: #1b1226;
  --vellum-hi: #251a33;
  --rule: #5b4373;
  --rule-soft: #3a2a4c;
  --gilt: #d9b46a;
  --gilt-hi: #f3d79a;
  --candle: #ffcf7a;
  --ruby: #a3183f;
  --ruby-hi: #d8325f;
  --bone: #efe6d6;
  --bone-dim: #c4b7c9;
  --bone-mute: #9d90a8;
  --alive: #ffc76b;
  --zombie: #a8c96a;
  --ghost: #8ee8dc;
  --dead: #a597ae;
  --bad: #ff8794;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --serif: "Cormorant Garamond", "Noto Serif SC", "Songti SC", Georgia, serif;
  --cjk: "Noto Serif SC", "Songti SC", "Cormorant Garamond", serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--void);
  color: var(--bone);
  font: 16px/1.75 var(--cjk);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  caret-color: var(--candle);
}
::selection { background: rgba(216, 50, 95, .45); color: #fff; }
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: var(--void); }
::-webkit-scrollbar-thumb { background: var(--plum); border: 3px solid var(--void); border-radius: 8px; }
html { scrollbar-color: var(--plum) var(--void); }
[hidden] { display: none !important; }
a { color: var(--gilt-hi); text-underline-offset: 3px; text-decoration-color: rgba(217,180,106,.5); }
:focus-visible { outline: 2px solid var(--candle); outline-offset: 3px; border-radius: 3px; }
.sr-defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ===================== Scene (fixed, decorative) ===================== */
.scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  background:
    radial-gradient(700px 420px at 18% 12%, rgba(120, 82, 190, .28), transparent 65%),
    radial-gradient(900px 500px at 80% 100%, rgba(163, 24, 63, .22), transparent 70%),
    linear-gradient(180deg, #08060f 0%, var(--night) 38%, var(--nave) 70%, #120b1a 100%);
}
.scene svg { display: block; }
.stars { position: absolute; inset: 0 0 40% 0; }
.stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #f2e8ff; opacity: .5;
  animation: twinkle var(--d, 5s) ease-in-out var(--dl, 0s) infinite; }
.stars i.big { width: 3px; height: 3px; box-shadow: 0 0 6px 1px rgba(242,232,255,.6); }
@keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
.moon { position: absolute; top: 5vh; left: max(4vw, 24px); width: clamp(110px, 15vw, 200px); aspect-ratio: 1; }
.moon .halo { animation: breathe 9s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
.cathedral { position: absolute; right: -2vw; bottom: 90px; width: min(760px, 70vw); height: auto; opacity: .95; }
.cathedral .pane { animation: pane-glow 7s ease-in-out infinite; }
.cathedral .pane:nth-of-type(2n) { animation-delay: -3s; }
@keyframes pane-glow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
.tree { position: absolute; left: -30px; bottom: 80px; width: min(380px, 40vw); height: auto; }
.bats { position: absolute; top: 9vh; left: 8vw; width: 420px; height: 220px; overflow: visible; }
.bat { transform-box: fill-box; transform-origin: center; }
.bat .wing { transform-box: fill-box; transform-origin: center; animation: flap .32s ease-in-out infinite alternate; }
.bat.a { animation: fly-a 22s linear infinite; }
.bat.b { animation: fly-b 30s linear -11s infinite; opacity: .75; }
.bat.c { animation: fly-c 26s linear -5s infinite; opacity: .55; }
@keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.35); } }
@keyframes fly-a { 0% { translate: -60px 80px; } 50% { translate: 220px 20px; } 100% { translate: 520px 110px; } }
@keyframes fly-b { 0% { translate: 480px 40px; } 50% { translate: 200px 130px; } 100% { translate: -80px 60px; } }
@keyframes fly-c { 0% { translate: 100px 180px; } 50% { translate: 330px 90px; } 100% { translate: 600px 150px; } }
.fog { position: absolute; left: -20%; width: 140%; height: 220px; bottom: 40px;
  background:
    radial-gradient(40% 50% at 20% 70%, rgba(176, 160, 214, .16), transparent 70%),
    radial-gradient(35% 45% at 60% 80%, rgba(142, 232, 220, .07), transparent 70%),
    radial-gradient(40% 55% at 90% 65%, rgba(176, 160, 214, .14), transparent 70%);
  filter: blur(14px); animation: drift 40s ease-in-out infinite alternate; }
.fog.two { bottom: 0; opacity: .8; animation-duration: 55s; animation-direction: alternate-reverse; }
@keyframes drift { from { transform: translateX(-6%); } to { transform: translateX(6%); } }
.fence { position: absolute; left: 0; right: 0; bottom: 70px; height: 70px; width: 100%; }
.earth { position: absolute; left: 0; right: 0; bottom: 0; height: 110px;
  background: linear-gradient(180deg, #170f1f 0%, #0d0911 100%); }
.motes i { position: absolute; bottom: -10px; width: 3px; height: 3px; border-radius: 50%;
  background: var(--candle); box-shadow: 0 0 8px 2px rgba(255,207,122,.6); opacity: 0;
  animation: mote var(--d, 14s) linear var(--dl, 0s) infinite; }
@keyframes mote { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: .9; } 100% { transform: translate(var(--dx, 40px), -70vh); opacity: 0; } }
@keyframes breathe { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }

/* ===================== Page ===================== */
.wrap { position: relative; z-index: 2; max-width: 1120px; margin: 0 auto;
  padding: 28px max(16px, env(safe-area-inset-left)) 120px max(16px, env(safe-area-inset-right)); }

/* Title with rose window */
.crown { position: relative; text-align: center; padding: 34px 0 10px; }
.rose { position: absolute; left: 50%; top: -6px; width: clamp(240px, 34vw, 380px); aspect-ratio: 1;
  translate: -50% 0; opacity: .62; z-index: -1; }
.rose .spin { transform-origin: 200px 200px; animation: spin 180s linear infinite; }
.rose .light { animation: breathe 6s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.crown h1 { margin: 0; font: 400 clamp(46px, 8.2vw, 96px)/1.02 "UnifrakturMaguntia", "Cormorant Garamond", serif;
  color: var(--bone); letter-spacing: .005em;
  text-shadow: 0 2px 0 #2a0b18, 0 0 26px rgba(216, 50, 95, .45), 0 0 70px rgba(255, 207, 122, .18); }
.crown h1 span { display: block; }
.crown .sub { margin: 22px auto 0; max-width: 34em; color: var(--bone-dim); font-size: 16.5px; line-height: 1.85; text-wrap: balance; }
.divider { display: block; width: 240px; height: 22px; margin: 18px auto 0; }

/* Grimoire entry panel */
.entry { position: relative; margin: 38px auto 0; max-width: 860px; padding: 30px 34px 26px;
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(217,180,106,.07), transparent 60%),
    linear-gradient(180deg, var(--vellum-hi), var(--vellum));
  border: 1px solid var(--rule);
  border-radius: 140px 140px 6px 6px / 46px 46px 6px 6px;
  box-shadow: inset 0 0 0 5px var(--vellum), inset 0 0 0 6px rgba(217,180,106,.28), 0 30px 60px -20px rgba(0,0,0,.8); }
.entry .corner { position: absolute; width: 34px; height: 34px; bottom: 8px; color: var(--gilt); opacity: .7; }
.entry .corner.l { left: 8px; } .entry .corner.r { right: 8px; transform: scaleX(-1); }
.entry label { display: block; text-align: center; color: var(--bone-dim); font-size: 15px; margin: 6px 0 14px; }
.entry label code { font: 500 13.5px var(--mono); color: var(--gilt-hi); }
.entry textarea { display: block; width: 100%; min-height: 176px; resize: vertical;
  background: #0d0913; color: var(--bone); border: 1px solid var(--rule-soft); border-radius: 4px;
  padding: 16px 18px; font: 13.5px/1.7 var(--mono);
  box-shadow: inset 0 2px 18px rgba(0,0,0,.6); transition: border-color .2s, box-shadow .2s; }
.entry textarea::placeholder { color: #8c7f98; }
.entry textarea:focus-visible { outline: none; border-color: var(--gilt); box-shadow: inset 0 2px 18px rgba(0,0,0,.6), 0 0 0 3px rgba(217,180,106,.25); }
.actions { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 22px; cursor: pointer;
  font: 600 16px/1 var(--cjk); letter-spacing: .06em; color: var(--bone); text-decoration: none;
  background: transparent; border: 1px solid var(--rule); border-radius: 3px;
  transition: border-color .2s, color .2s, background .2s, transform .15s var(--ease-out); }
.btn:hover { border-color: var(--gilt); color: var(--gilt-hi); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { padding: 0 30px; color: #fff4e2; border-color: #e4a35a;
  background: linear-gradient(180deg, #b8204b, var(--ruby) 55%, #6e0d2a);
  box-shadow: inset 0 1px 0 rgba(255,220,180,.35), 0 8px 24px -6px rgba(216,50,95,.6); }
.btn.primary:hover { color: #fff; background: linear-gradient(180deg, #c42653, #a91a44 55%, #7b1030); box-shadow: inset 0 1px 0 rgba(255,220,180,.4), 0 10px 30px -6px rgba(216,50,95,.8); }
.btn.quiet { border-color: transparent; color: var(--bone-dim); }
.btn.quiet:hover { border-color: var(--rule); }
.hint { margin: 16px 0 0; text-align: center; color: var(--bone-mute); font-size: 13.5px; }

/* Status + summoning circle */
.statusline { min-height: 30px; margin: 26px 0 0; text-align: center; color: var(--bone-dim); font-size: 15px; }
.scene-note { min-height: 24px; text-align: center; color: var(--candle); font: italic 500 18px var(--serif); }
.summon { display: none; justify-content: center; margin: 6px 0 0; }
.summon.show { display: flex; }
.summon svg { width: 88px; height: 88px; }
.summon .ring-a { transform-origin: 50px 50px; animation: spin 9s linear infinite; }
.summon .ring-b { transform-origin: 50px 50px; animation: spin 14s linear infinite reverse; }
.summon .core { animation: breathe 1.6s ease-in-out infinite; }

/* Census (summary) */
.census { display: flex; justify-content: center; align-items: baseline; flex-wrap: wrap; gap: 6px 26px;
  margin: 26px auto 0; padding: 14px 20px; max-width: 900px;
  border-top: 1px solid var(--rule-soft); border-bottom: 1px solid var(--rule-soft); }
.census .total { font: 600 22px var(--serif); color: var(--bone); }
.census .total b { font-variant-numeric: lining-nums tabular-nums; color: var(--gilt-hi); font-weight: 700; }
.legend { display: contents; }
.legend span { display: inline-flex; align-items: center; gap: 7px; color: var(--bone-dim); font-size: 14.5px; font-variant-numeric: tabular-nums; }
.legend svg { width: 20px; height: 20px; }
.legend b { color: var(--bone); font: 700 17px var(--serif); }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; margin: 22px 0 8px; }
.filt, .toggle { min-height: 40px; padding: 0 14px; border: 1px solid transparent; background: transparent; color: var(--bone-mute);
  font: 600 14.5px/1 var(--cjk); border-radius: 3px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  transition: color .2s, border-color .2s, background .2s; }
.filt::before { content: ""; width: 6px; height: 6px; rotate: 45deg; background: var(--c, var(--bone-mute)); opacity: .6; }
.filt[data-filter="alive"] { --c: var(--alive); } .filt[data-filter="zombie"] { --c: var(--zombie); }
.filt[data-filter="ghost"] { --c: var(--ghost); } .filt[data-filter="dead"] { --c: var(--dead); }
.filt[data-filter="error"] { --c: var(--bad); } .filt[data-filter="all"] { --c: var(--gilt); }
.filt:hover, .toggle:hover { color: var(--bone); border-color: var(--rule-soft); }
.filt.on { color: var(--bone); border-color: var(--rule); background: rgba(54,32,79,.55); }
.filt.on::before { opacity: 1; box-shadow: 0 0 8px var(--c); }
.toolbar .sep { width: 1px; height: 22px; background: var(--rule-soft); margin: 0 8px; }
.toggle.on { color: var(--gilt-hi); border-color: var(--gilt); }

/* ===================== Graveyard ===================== */
.graveyard { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 8px 10px;
  padding: 30px 6px 50px; margin-top: 10px; position: relative; }
.stone-btn { position: relative; background: none; border: 0; padding: 0 0 6px; margin: 0; cursor: pointer; color: inherit;
  min-height: 236px; border-radius: 10px; font: inherit;
  animation: rise .9s var(--ease-out) both; }
@keyframes rise { from { opacity: 0; transform: translateY(26px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.stone-btn:focus-visible { outline: 2px solid var(--candle); outline-offset: 2px; }
.svgwrap { position: relative; display: block; width: 168px; margin: 0 auto;
  transform: translateY(var(--rise, 0px)) rotate(var(--lean, 0deg)); transform-origin: 50% 88%;
  transition: transform .5s var(--ease-out), filter .4s; }
.svgwrap > svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 14px 12px rgba(0,0,0,.6)); }
.stone-btn:hover .svgwrap, .stone-btn:focus-visible .svgwrap {
  transform: translateY(calc(var(--rise, 0px) - 6px)) rotate(var(--lean, 0deg)) scale(1.04);
  filter: drop-shadow(0 0 18px var(--aura, rgba(255,207,122,.35))); }
.status-alive { --aura: rgba(255,199,107,.45); } .status-zombie { --aura: rgba(168,201,106,.4); }
.status-ghost { --aura: rgba(142,232,220,.45); } .status-dead { --aura: rgba(165,151,174,.35); }
.depth-back .svgwrap { scale: .9; opacity: .88; } .depth-front .svgwrap { scale: 1.04; }
.engrave { position: absolute; left: 50%; top: 46%; width: 52%; translate: -50% 0; text-align: center; pointer-events: none;
  font: 700 14px/1.12 var(--serif); color: #e9dfcf; overflow-wrap: anywhere; letter-spacing: .01em;
  text-shadow: 0 -1px 0 rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.14); }
.engrave small { display: block; white-space: nowrap; margin-top: 8px; font: 600 11px/1.3 var(--cjk); letter-spacing: .04em; color: var(--tag, #cdbfae); text-shadow: 0 1px 2px #000; }
.status-alive .engrave small { --tag: var(--alive); } .status-zombie .engrave small { --tag: var(--zombie); }
.status-ghost .engrave { color: #dffaf6; } .status-ghost .engrave small { --tag: var(--ghost); }
.status-dead .engrave { color: #cfc4d3; } .status-dead .engrave small { --tag: var(--dead); }
.status-error .engrave small { --tag: var(--bad); }

/* Grave animations — transform/opacity only */
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.3s ease-in-out infinite alternate; }
.flame.b { animation-duration: 1.05s; animation-delay: -.4s; }
@keyframes flicker { 0% { transform: scale(.9, 1.05) rotate(-3deg); } 50% { transform: scale(1.05, .92) rotate(2deg); } 100% { transform: scale(.95, 1.1) rotate(4deg); } }
.candle-glow { animation: breathe 1.8s ease-in-out infinite; }
.ember { animation: ember 4.5s ease-out infinite; transform-box: fill-box; }
.ember:nth-of-type(2) { animation-delay: -1.5s; } .ember:nth-of-type(3) { animation-delay: -3s; }
@keyframes ember { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(6px, -46px); opacity: 0; } }
.claw { transform-box: fill-box; transform-origin: 50% 100%; animation: claw 5.5s var(--ease-out) infinite; }
@keyframes claw { 0%, 8% { transform: translateY(16px) rotate(-6deg); } 30%, 72% { transform: translateY(0) rotate(4deg); } 78% { transform: translateY(1px) rotate(-3deg); } 84% { transform: translateY(0) rotate(5deg); } 100% { transform: translateY(16px) rotate(-6deg); } }
.fingers { transform-box: fill-box; transform-origin: 50% 100%; animation: grasp 1.1s ease-in-out infinite alternate; }
@keyframes grasp { from { transform: scaleY(1); } to { transform: scaleY(.82) skewX(-6deg); } }
.clod { animation: clod 5.5s ease-out infinite; transform-box: fill-box; }
.clod.b { animation-delay: .15s; }
@keyframes clod { 0%, 18% { transform: translate(0,0); opacity: 0; } 22% { opacity: 1; } 40%, 100% { transform: translate(var(--cx, -8px), 4px); opacity: 0; } }
.moss-drip { transform-box: fill-box; transform-origin: 50% 0; animation: drip 4s ease-in-out infinite; }
@keyframes drip { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.25); } }
.spirit { transform-box: fill-box; animation: hover 4.2s ease-in-out infinite; }
@keyframes hover { 0%, 100% { transform: translate(0, 0) rotate(-2deg); } 50% { transform: translate(-3px, -9px) rotate(3deg); } }
.hem { transform-box: fill-box; transform-origin: 50% 0; animation: hem 1.6s ease-in-out infinite alternate; }
@keyframes hem { from { transform: skewX(-8deg); } to { transform: skewX(8deg); } }
.eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.wisp { animation: wisp 3.8s ease-out infinite; transform-box: fill-box; }
.wisp.b { animation-delay: -1.9s; }
@keyframes wisp { 0% { transform: translate(0,0) scale(.6); opacity: 0; } 25% { opacity: .8; } 100% { transform: translate(-10px,-34px) scale(1.2); opacity: 0; } }
.fade-stone { animation: breathe 5s ease-in-out infinite; }
.crow-head { transform-box: fill-box; transform-origin: 80% 80%; animation: crow 7s ease-in-out infinite; }
@keyframes crow { 0%, 40%, 100% { transform: rotate(0); } 45%, 70% { transform: rotate(-16deg); } 75% { transform: rotate(6deg); } }
.spider { animation: spider 6s ease-in-out infinite; transform-box: fill-box; }
@keyframes spider { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
.thread { transform-box: fill-box; transform-origin: 50% 0; animation: thread 6s ease-in-out infinite; }
@keyframes thread { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(2.2); } }
.petal { animation: petal 7s ease-in infinite; transform-box: fill-box; }
@keyframes petal { 0%, 60% { transform: translate(0,0) rotate(0); opacity: 0; } 65% { opacity: 1; } 100% { transform: translate(-10px, 26px) rotate(140deg); opacity: 0; } }

.crowded .svgwrap * { animation: none !important; }
.crowded .stone-btn { animation-duration: .4s; }

/* ===================== Table ===================== */
.tableview { display: none; width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 14.5px;
  background: rgba(27,18,38,.88); border: 1px solid var(--rule-soft); }
.tableview.show { display: table; }
.graveyard.hide { display: none; }
.tableview caption { text-align: left; padding: 0 0 8px; color: var(--bone-mute); font-size: 13px; }
.tableview th, .tableview td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--rule-soft); }
.tableview th { color: var(--gilt); font: 600 14px var(--cjk); background: rgba(54,32,79,.4); }
.tableview td:first-child { font: 600 15px var(--serif); color: var(--bone); overflow-wrap: anywhere; }
.tableview td { color: var(--bone-dim); font-variant-numeric: tabular-nums; vertical-align: top; }
.tableview tr:hover td { background: rgba(217,180,106,.04); }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 13px var(--cjk); white-space: nowrap; color: var(--c); }
.chip::before { content: ""; width: 7px; height: 7px; rotate: 45deg; background: currentColor; }
.chip.alive { --c: var(--alive); } .chip.zombie { --c: var(--zombie); } .chip.ghost { --c: var(--ghost); }
.chip.dead { --c: var(--dead); } .chip.local { --c: var(--bone-mute); } .chip.err { --c: var(--bad); }
.table-scroll { overflow-x: auto; }

/* ===================== Detail reliquary ===================== */
.overlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 16px;
  background: radial-gradient(circle at 50% 40%, rgba(54,32,79,.55), rgba(6,3,10,.86)); }
.overlay.open { display: flex; animation: veil .35s ease-out; }
@keyframes veil { from { opacity: 0; } }
.detail { position: relative; width: 100%; max-width: 520px; max-height: 88vh; overflow: auto; text-align: center;
  padding: 54px 34px 28px; color: var(--bone);
  background: radial-gradient(90% 50% at 50% 0%, rgba(217,180,106,.1), transparent 70%), linear-gradient(180deg, #281b37, #160f20);
  border: 1px solid var(--rule); border-radius: 260px 260px 6px 6px / 90px 90px 6px 6px;
  box-shadow: inset 0 0 0 6px #1d1428, inset 0 0 0 7px rgba(217,180,106,.3), 0 40px 90px -20px #000;
  animation: lift .5s var(--ease-out); }
@keyframes lift { from { transform: translateY(18px) scale(.98); opacity: 0; } }
.detail .sigil { width: 46px; height: 46px; display: block; margin: 0 auto 10px; }
.detail h2 { margin: 0; font: 700 30px/1.15 var(--serif); overflow-wrap: anywhere; color: var(--title, var(--bone)); }
.detail .ver { margin-top: 6px; color: var(--bone-mute); font: 13px var(--mono); }
.detail .epi { margin: 18px auto 20px; max-width: 30em; color: var(--bone-dim); font: italic 500 18px/1.6 var(--serif); }
.detail .epi::before, .detail .epi::after { content: "❦"; display: none; }
.detail dl { margin: 0; text-align: left; }
.detail dl > div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 2px; border-top: 1px solid var(--rule-soft); }
.detail dt { color: var(--bone-mute); font-size: 14px; }
.detail dd { margin: 0; text-align: right; font: 600 16px var(--serif); font-variant-numeric: lining-nums tabular-nums; overflow-wrap: anywhere; }
.detail dd.mute { font: 400 13.5px var(--cjk); color: var(--bone-mute); }
.detail .actions { margin-top: 22px; }

/* ===================== Empty + footer ===================== */
.empty { text-align: center; padding: 50px 10px 30px; color: var(--bone-mute); }
.empty svg { width: 120px; height: auto; margin-bottom: 8px; }
.empty .big { color: var(--bone-dim); font: italic 600 24px var(--serif); }
.empty .sub { margin-top: 4px; font-size: 14.5px; }
footer.foot { margin-top: 56px; text-align: center; color: var(--bone-mute); font-size: 13.5px; }

/* ===================== Reduced motion ===================== */
body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ===================== Responsive ===================== */
@media (max-width: 760px) {
  .cathedral { width: 120vw; right: -40vw; opacity: .55; }
  .tree { display: none; }
  .bats { scale: .6; transform-origin: left top; }

  .engrave small { font-size: 10.5px; margin-top: 5px; }
  .toolbar .sep { display: none; }
  .detail { padding: 44px 20px 22px; border-radius: 180px 180px 6px 6px / 60px 60px 6px 6px; }
  .tableview { font-size: 13.5px; }
  .tableview th, .tableview td { padding: 9px 10px; }
}

  function isNonRegistryRange(range) {
    if (typeof range !== 'string' || range.trim() === '') return true;
    var r = range.trim();

    if (/^git(\+|:)/.test(r)) return true;
    if (/^(http|ftp)s?:/.test(r)) return true;
    if (/^\.{0,2}\//.test(r)) return true;
    return false;
  }
  function aliasedName(range) {
    var s = range.trim();

    else {
      var m = STATUS_META[res.status];
      var when = res.lastPublishTime ? new Date(res.lastPublishTime).toLocaleDateString('zh-CN', { year: 'numeric', month: 'short' }) : '未知';
      aria = dep.name + '，' + m.label + '，最后发布于 ' + when + '，近一周下载 ' + fmtNum(res.weeklyDownloads);
    }
    btn.setAttribute('aria-label', aria);

    var wrap = document.createElement('span');
    wrap.className = 'svgwrap';
    wrap.innerHTML = graveSVG(kind, v); // static markup only; no package data inside
    var engrave = document.createElement('span');
    engrave.className = 'engrave';
    engrave.textContent = dep.name;
    var small = document.createElement('small');
    small.textContent = pending ? '查询中…' : metaLine(res);
    engrave.appendChild(small);
    wrap.appendChild(engrave);
    btn.appendChild(wrap);

    // Entrance only the first time a stone appears in its final state
    var key = dep.name + ':' + kind;
    if (renderedOnce[key]) btn.style.animation = 'none';
    else { renderedOnce[key] = true; btn.style.animationDelay = Math.min(idx, 20) * 0.06 + 's'; }

    if (!pending) btn.addEventListener('click', function () { lastFocusedStone = btn; openDetail(dep); });
    else btn.setAttribute('aria-disabled', 'true');
    return btn;
  }

  /* ===================== Summary ===================== */
  function counts() {
    var c = { alive: 0, zombie: 0, ghost: 0, dead: 0, local: 0, error: 0 };
    ALL_DEP_ORDER.forEach(function (dep) {
      var r = state.results[dep.name];
      if (r) c[kindOf(r)]++;
    });
    return c;
  }
  function renderSummary() {
    var total = ALL_DEP_ORDER.length;
    var bar = $('summarybar'), tb = $('toolbar');
    if (total === 0) { bar.hidden = true; tb.hidden = true; return; }
    bar.hidden = false; tb.hidden = false;
    var c = counts();
    var tot = $('sum-total');
    tot.textContent = '';
    var b = document.createElement('b'); b.textContent = total;
    tot.appendChild(b); tot.appendChild(document.createTextNode(' 座墓碑'));
    var labels = [['alive', '活着'], ['zombie', '僵尸'], ['ghost', '幽灵'], ['dead', '已死'], ['local', '本地'], ['error', '异常']];
    var html = '';
    labels.forEach(function (o) {
      if (!c[o[0]] && (o[0] === 'local' || o[0] === 'error')) return;
      html += '<span>' + sigil(o[0]) + o[1] + ' <b>' + c[o[0]] + '</b></span>';
    });
    $('legend').innerHTML = html;
    var note = $('scene-note');
    if (c.alive === total) note.textContent = '没有亡魂。每一座碑前都点着烛火。';
    else if (c.dead === total) note.textContent = '整片墓园沉入黑暗，雾变得更浓了。';
    else note.textContent = '';
  }

  /* ===================== Filter ===================== */
  function filterPass(dep, res) {
    var f = state.filter;
    if (f === 'all') return true;
    if (!res) return false;
    if (f === 'local') return !!res.local;
    if (f === 'error') return isErr(res);
    return res.status === f;
  }

  /* ===================== Render ===================== */
  function renderGraveyard() {
    var g = $('graveyard');
    var hadFocus = document.activeElement && document.activeElement.classList.contains('stone-btn') ? document.activeElement.dataset.name : null;
    g.textContent = '';
    var shown = 0;
    ALL_DEP_ORDER.forEach(function (dep) {
      var res = state.results[dep.name];
      if (state.filter !== 'all' && !filterPass(dep, res)) return;
      g.appendChild(buildStone(dep, shown));
      shown++;
    });
    if (hadFocus) {
      var again = g.querySelector('[data-name="' + CSS.escape(hadFocus) + '"]');
      if (again) again.focus();
    }
    var empty = $('empty');
    if (ALL_DEP_ORDER.length === 0) {
      empty.hidden = false;
      empty.querySelector('.big').textContent = '墓园还很安静。';
      empty.querySelector('.sub').textContent = '粘贴你的 package.json，或点「填入示例」。';
    } else if (shown === 0) {
      empty.hidden = false;
      empty.querySelector('.big').textContent = '这一排空无一碑。';
      empty.querySelector('.sub').textContent = '没有符合当前筛选的依赖，换一个筛选试试。';
    } else empty.hidden = true;
  }
  function renderTable() {
    var tb = $('tbody');
    tb.textContent = '';
    ALL_DEP_ORDER.forEach(function (dep) {
      var res = state.results[dep.name];
      if (!res || !filterPass(dep, res)) return;
      var tr = document.createElement('tr');
      var c = function (text) { var td = document.createElement('td'); td.textContent = text; return td; };
      tr.appendChild(c(dep.name));
      tr.appendChild(c(dep.kind === 'dependency' ? 'dependencies' : 'devDependencies'));
      var td = document.createElement('td'), chip = document.createElement('span');
      chip.className = 'chip';
      if (res.local) { chip.textContent = '本地/私有'; chip.classList.add('local'); }
      else if (res.notFound) { chip.textContent = '未找到'; chip.classList.add('err'); }
      else if (isErr(res)) { chip.textContent = '读取失败'; chip.classList.add('err'); }
      else { var m = STATUS_META[res.status]; chip.textContent = m.label; chip.classList.add(m.cls); }
      td.appendChild(chip); tr.appendChild(td);
      tr.appendChild(c(res.lastPublishTime ? new Date(res.lastPublishTime).toLocaleDateString('zh-CN') : '—'));
      tr.appendChild(c(res.weeklyDownloads != null ? fmtNum(res.weeklyDownloads) : '—'));
      tr.appendChild(c(res.deprecated ? truncate(res.deprecated, 40) : (res.local ? '未查询 npm' : '')));
      tb.appendChild(tr);
    });
  }
  function renderAll() { renderGraveyard(); renderTable(); renderSummary(); }

  /* ===================== Detail ===================== */
  function openDetail(dep) {
    var res = state.results[dep.name] || {};
    var kind = kindOf(res);
    var title = $('detail-title'), dl = $('detail-dl'), link = $('detail-link'), alt = $('detail-alt');
    title.textContent = dep.name;
    $('detail-sigil').innerHTML = sigil(kind);
    $('detail').style.setProperty('--title', STATUS_META[kind] ? STATUS_META[kind].color : 'var(--bone)');
    $('detail-range').textContent = dep.range + ' · ' + (dep.kind === 'dependency' ? 'dependencies' : 'devDependencies');
    dl.textContent = '';
    function row(dt, dd, cls) {
      var div = document.createElement('div');
      var a = document.createElement('dt'); a.textContent = dt;
      var b = document.createElement('dd'); b.textContent = dd; if (cls) b.className = cls;
      div.appendChild(a); div.appendChild(b); dl.appendChild(div);
    }
    var showLinks = true;
    if (res.local) { $('detail-epi').textContent = EPITAPHS.local; row('类型', '本地 / 私有'); showLinks = false; }
    else if (res.notFound) { $('detail-epi').textContent = EPITAPHS.notfound; row('状态', '注册表中未找到'); }
    else if (isErr(res)) { $('detail-epi').textContent = EPITAPHS.error; row('状态', '读取失败' + (res.httpError ? '（HTTP ' + res.httpError + '）' : '')); }
    else {
      $('detail-epi').textContent = EPITAPHS[res.status];
      row('状态', STATUS_META[res.status].label);
      row('最后发布', res.lastPublishTime ? new Date(res.lastPublishTime).toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' }) : '尚未发布');
      row('近一周下载', fmtNum(res.weeklyDownloads));
      if (res.deprecated) row('弃用说明', truncate(res.deprecated, 80), 'mute');
      row('备注', '这只是维护活跃度，不是安全审计。', 'mute');
    }
    link.hidden = !showLinks; alt.hidden = !showLinks;
    link.href = 'https://www.npmjs.com/package/' + encodeURIComponent(dep.name).replace('%40', '@');
    alt.href = 'https://www.npmjs.com/search?q=' + encodeURIComponent(dep.name);
    $('overlay').classList.add('open');
    $('detail-close').focus();
  }
  function closeDetail() {
    $('overlay').classList.remove('open');
    if (lastFocusedStone && document.body.contains(lastFocusedStone)) lastFocusedStone.focus();
    else if (lastFocusedStone) {
      var again = $('graveyard').querySelector('[data-name="' + CSS.escape(lastFocusedStone.dataset.name) + '"]');
      if (again) again.focus();
    }
  }

  /* ===================== Main ===================== */
  function setStatus(text) { $('statusline').textContent = text; }
  async function run(input) {
    if (input.length > 1024 * 1024) { setStatus('输入超过 1MB，请精简后再试。'); return; }
    var parsed;
    try { parsed = parsePackageJson(input); }
    catch (e) { setStatus('没能解析：' + e.message + '。输入仍在框里，修改后再试。'); return; }

    var batch = ++state.batch;
    if (state.controller) state.controller.abort();
    var controller = new AbortController();
    state.controller = controller;

    ALL_DEP_ORDER = parsed;
    renderedOnce = {};
    document.body.classList.toggle('crowded', parsed.length > 40);
    state.results = {};
    state.filter = 'all';
    syncFilterUI();

    parsed.forEach(function (dep) {
      var alias = aliasedName(dep.range);
      if (alias) dep.queryName = alias;
      if (isNonRegistryRange(dep.range) && !alias) state.results[dep.name] = { name: dep.name, local: true };
    });

    setStatus('找到 ' + parsed.length + ' 个依赖，正在向 npm 打听它们的近况…');
    $('summon').classList.add('show');
    renderAll();

    var registryDeps = parsed.filter(function (d) { return !state.results[d.name]; });
    try {
      await runConcurrent(registryDeps, 6, async function (dep) {
        if (controller.signal.aborted) return undefined;
        return await fetchPackageHealth(dep.queryName || dep.name, controller.signal);
      }, function (out) {
        if (batch !== state.batch || !out) return;
        var target = ALL_DEP_ORDER.find(function (d) { return (d.queryName || d.name) === out.name && !state.results[d.name]; }) ||
                     ALL_DEP_ORDER.find(function (d) { return (d.queryName || d.name) === out.name; });
        if (!target) return;
        if (out.notFound) out.status = 'notfound';
        else if (out.httpError || out.error) out.status = 'error';
        else out.status = classify(out);
        state.results[target.name] = out;
        renderAll();
      });
      if (batch === state.batch) {
        setStatus('探访完毕，' + parsed.length + ' 座墓碑已立好。点击任意一块查看详情。');
        $('summon').classList.remove('show');
        renderAll();
      }
    } catch (e) {
      if (batch !== state.batch) return;
      setStatus(controller.signal.aborted ? '已取消上一次探访。' : '网络出错：' + (e && e.message || e));
      $('summon').classList.remove('show');
    }
  }

  function syncFilterUI() {
    document.querySelectorAll('.filt').forEach(function (f) {
      var on = f.dataset.filter === state.filter;
      f.classList.toggle('on', on);
      f.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  /* ===================== Keyboard ===================== */
  $('graveyard').addEventListener('keydown', function (e) {
    var stones = Array.prototype.slice.call(this.querySelectorAll('.stone-btn'));
    var idx = stones.indexOf(document.activeElement);
    if (idx === -1) return;
    var cols = 1, top0 = stones[0].offsetTop;
    while (cols < stones.length && stones[cols].offsetTop === top0) cols++;
    var dir = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
    if (dir === undefined) return;
    e.preventDefault();
    stones[Math.min(Math.max(idx + dir, 0), stones.length - 1)].focus();
  });
  document.addEventListener('keydown', function (e) {
    if (!$('overlay').classList.contains('open')) return;
    if (e.key === 'Escape') { closeDetail(); return; }
    if (e.key === 'Tab') { // keep focus inside the dialog
      var f = Array.prototype.filter.call($('detail').querySelectorAll('a[href], button'), function (el) { return !el.hidden; });
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  $('detail-close').addEventListener('click', closeDetail);
  $('overlay').addEventListener('click', function (e) { if (e.target === this) closeDetail(); });

  /* ===================== Toolbar ===================== */
  document.querySelectorAll('.filt').forEach(function (f) {
    f.addEventListener('click', function () { state.filter = f.dataset.filter; syncFilterUI(); renderGraveyard(); renderTable(); });
  });
  $('toggle-table').addEventListener('click', function () {
    state.view = state.view === 'table' ? 'grid' : 'table';
    var on = state.view === 'table';
    this.classList.toggle('on', on); this.setAttribute('aria-pressed', on);
    $('graveyard').classList.toggle('hide', on);
    $('tableview').classList.toggle('show', on);
  });
  $('toggle-motion').addEventListener('click', function () {
    state.reducedMotion = !state.reducedMotion;
    document.body.classList.toggle('reduce-motion', state.reducedMotion);
    this.classList.toggle('on', state.reducedMotion); this.setAttribute('aria-pressed', state.reducedMotion);
  });

  /* ===================== Sky ===================== */
  function seeded(seed) { return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
  function paintSky() {
    var r = seeded(42), stars = $('stars'), motes = $('motes'), i, s;
    for (i = 0; i < 90; i++) {
      s = document.createElement('i');
      if (i % 9 === 0) s.className = 'big';
      s.style.left = (r() * 100) + '%'; s.style.top = (r() * 100) + '%';
      s.style.setProperty('--d', (3 + r() * 5) + 's'); s.style.setProperty('--dl', (-r() * 6) + 's');
      stars.appendChild(s);
    }
    for (i = 0; i < 14; i++) {
      s = document.createElement('i');
      s.style.left = (r() * 100) + '%';
      s.style.setProperty('--d', (12 + r() * 12) + 's'); s.style.setProperty('--dl', (-r() * 20) + 's');
      s.style.setProperty('--dx', (r() * 120 - 60) + 'px');
      motes.appendChild(s);
    }
  }

  /* ===================== Input ===================== */
  $('btn-example').addEventListener('click', function () { $('pkg-input').value = EXAMPLE; $('pkg-input').focus(); });
  $('btn-clear').addEventListener('click', function () { $('pkg-input').value = ''; $('pkg-input').focus(); });
  $('btn-submit').addEventListener('click', function () { run($('pkg-input').value); });
  $('pkg-input').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) run(this.value); });

  paintSky();
  renderGraveyard();
})();
</script>
</body>
</html>
