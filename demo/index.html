<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dependency Graveyard · 依赖墓地</title>
<meta name="description" content="粘贴你的 package.json，让依赖变成一座墓地：谁活着，谁成了僵尸，谁是幽灵，谁已入土。" />
<style>
  :root {
    --bg: #0e0b14; --panel: #17121f; --raised: #211a2c; --border: #382d49;
    --text: #ece6f4; --muted: #b4a8c6; --muted-dim: #8d819e;
    --accent: #b794f6; --zombie: #9ad06b; --ghost: #7fb7ff; --dead: #9b8fa8; --alive: #ffd66b;
    --bad: #ff7b8a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  [hidden] { display: none !important; }

  /* ---------- 场景背景 ---------- */
  .scene {
    min-height: 100vh; position: relative; overflow: hidden;
    background:
      radial-gradient(1200px 500px at 78% -8%, rgba(183,148,246,.10), transparent 60%),
      radial-gradient(900px 400px at 8% 0%, rgba(127,183,255,.08), transparent 60%),
      linear-gradient(180deg, #0d0a16 0%, #0e0b14 40%, #141019 100%);
  }
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .stars span { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #cdbfe6; opacity: .5; animation: twinkle 5s infinite ease-in-out; }
  @keyframes twinkle { 0%,100% { opacity:.25; } 50% { opacity:.9; } }
  .moon {
    position: absolute; top: 42px; right: 64px; width: 92px; height: 92px; border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #fff6dd, #ffe4ae 55%, #d8bd7a 100%);
    box-shadow: 0 0 70px 12px rgba(255,233,184,.35), 0 0 120px 40px rgba(255,233,184,.12);
    pointer-events: none;
  }
  .trees { position: absolute; left: 0; right: 0; bottom: 200px; pointer-events: none; opacity: .5; }

  .wrap { position: relative; z-index: 2; max-width: 1060px; margin: 0 auto; padding: 44px 22px 140px; }

  /* ---------- 头部 ---------- */
  header.top { text-align: center; margin-bottom: 26px; }
  header.top h1 { font-size: 34px; margin: 0 0 6px; letter-spacing: .02em; }
  header.top h1 .moss { color: var(--muted); font-size: .72em; }
  header.top .sub { color: var(--muted); margin: 0; font-size: 15px; }

  /* ---------- 输入区 ---------- */
  .entry { background: rgba(23,18,31,.85); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px 20px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .entry label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 8px; }
  .entry label code { background: var(--card); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  .entry textarea {
    width: 100%; min-height: 150px; resize: vertical; background: #08060d; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .entry .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .btn {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    padding: 9px 18px; border-radius: 8px; font: 600 14px/1 inherit; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #1c1226; border-color: var(--accent); }
  .btn.primary:hover { background: #c9acf9; }
  .btn.ghostb { background: transparent; }
  .entry .hint { color: var(--muted-dim); font-size: 12.5px; margin: 10px 0 0; }

  /* ---------- 状态栏 / 汇总 ---------- */
  .statusline { min-height: 26px; margin: 14px 2px 4px; color: var(--muted); font-size: 14px; }
  .summarybar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin: 6px 0 18px;
  }
  .summarybar .big { font-size: 17px; font-weight: 700; }
  .summarybar .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; color: var(--muted); font-size: 13px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .legend .alive { background: var(--alive); } .legend .zombie { background: var(--zombie); }
  .legend .ghost { background: var(--ghost); } .legend .dead { background: var(--dead); }
  .legend .err { background: var(--bad); }

  /* ---------- 工具栏 ---------- */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 16px; }
  .filt { border: 1px solid var(--border); background: transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  .filt.on { color: var(--text); border-color: var(--accent); background: rgba(183,148,246,.08); }
  .toolbar .spacer { flex: 1; }
  .toggle { border: 1px solid var(--border); background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .toggle.on { color: var(--text); border-color: var(--accent); }

  /* ---------- 墓地网格 ---------- */
  .graveyard { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 26px 20px; margin-top: 10px; }
  .stone-btn {
    background: none; border: none; padding: 0; cursor: pointer; color: var(--text);
    text-align: center; position: relative; outline-offset: 4px;
  }
  .stone-btn .svgwrap { position: relative; margin: 0 auto; width: 118px; }
  .stone-btn svg { width: 118px; height: 140px; display: block; margin: 0 auto; filter: drop-shadow(0 12px 14px rgba(0,0,0,.45)); }
  .stone-btn .cap { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; line-height: 1.3; word-break: break-all; }
  .stone-btn .cap small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .stone-btn.local .cap { color: var(--muted); font-style: italic; }

  /* 灯光呼吸（活着） */
  .glow { animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity:.75; } 50% { opacity:1; } }
  /* 幽灵漂浮 */
  .floaty { animation: floaty 6s ease-in-out infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  /* 僵尸手抽动 */
  .twitch { animation: twitch 5s ease-in-out infinite; transform-origin: 32px 60px; }
  @keyframes twitch { 0%,92%,100% { transform: rotate(0); } 94% { transform: rotate(-2deg); } 96% { transform: rotate(2deg); } }

  /* 入场：墓碑错落"长出来" */
  .stone-btn { opacity: 0; transform: translateY(18px) scale(.96); animation: sprout .55s ease forwards; }
  @keyframes sprout { to { opacity: 1; transform: translateY(0) scale(1); } }

  /* ---------- 表格视图 ---------- */
  .tableview { display: none; width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; background: rgba(24,18,31,.7); border-radius: 10px; overflow: hidden; }
  .tableview.show { display: table; }
  .graveyard.hide { display: none; }
  .tableview th, .tableview td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); }
  .tableview th { color: var(--muted); font-weight: 600; font-size: 13px; }
  .tableview td { vertical-align: top; }
  .tableview .st { font-weight: 700; }
  .chip.st.local { color: var(--muted); } .chip.st.err { color: var(--bad); }

  /* ---------- 详情面板 ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(5,3,10,.6); display: none; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  .overlay.open { display: flex; }
  .detail {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; max-width: 520px; width: 100%;
    padding: 22px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.5); max-height: 84vh; overflow: auto;
  }
  .detail h2 { margin: 0 0 4px; font-size: 21px; word-break: break-all; }
  .detail .ver { color: var(--muted); font-size: 13px; }
  .detail .epi { font-size: 15px; color: var(--muted); margin: 12px 0 16px; }
  .detail dl { margin: 0; }
  .detail dl > div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--border); }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; text-align: right; font-weight: 600; }
  .detail dd.mute { color: var(--muted); font-weight: 400; }
  .detail .foot { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
  .detail .foot .close { margin-left: auto; }

  /* ---------- 空状态 ---------- */
  .empty { text-align: center; color: var(--muted); padding: 46px 10px; }
  .empty svg { width: 70px; height: 84px; opacity: .6; margin-bottom: 10px; }
  .empty .big { color: var(--text); font-weight: 600; }

  /* ---------- 挖坟加载 ---------- */
  .digbar { height: 4px; border-radius: 999px; background: var(--card); overflow: hidden; margin: 14px 0 4px; display: none; }
  .digbar.show { display: block; }
  .digbar i { display: block; height: 100%; width: 30%; border-radius: inherit; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: dig 1.1s infinite linear; }
  @keyframes dig { from { transform: translateX(-120%); } to { transform: translateX(360%); } }

  /* ---------- 减少动效 ---------- */
  body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after { animation: none !important; transition: none !important; }
  body.reduce-motion .stone-btn { opacity: 1; transform: none; }

  footer.foot { margin-top: 60px; text-align: center; color: var(--muted-dim); font-size: 12.5px; }

  @media (max-width: 720px) {
    header.top h1 { font-size: 26px; }
    .moon { right: 26px; top: 24px; width: 62px; height: 62px; }
    .graveyard { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 20px 14px; }
    .stone-btn .svgwrap, .stone-btn svg { width: 96px; }
    .stone-btn svg { height: 114px; }
  }
  /* ---------- Halloween prototype overrides ---------- */
  :root {
    --pumpkin: #ff8a3d; --pumpkin-hot: #ffc36a; --grave-green: #365a3e;
    --grass: #172d24; --soil: #191015; --sky-ink: #090914;
  }
  body { background: var(--sky-ink); }
  .scene {
    isolation: isolate;
    background:
      radial-gradient(900px 380px at 50% 44%, rgba(206, 80, 44, .17), transparent 65%),
      radial-gradient(800px 480px at 82% 0%, rgba(94, 72, 172, .33), transparent 65%),
      linear-gradient(180deg, #090a1a 0%, #17142f 45%, #291827 72%, #110d14 100%);
  }
  .wrap { z-index: 5; max-width: 1120px; padding-top: 38px; }
  .trees { display: none; }
  .moon {
    top: 37px; right: clamp(25px, 7vw, 96px); width: 112px; height: 112px; z-index: 0;
    background:
      radial-gradient(circle at 34% 32%, rgba(135, 103, 73, .28) 0 6%, transparent 7%),
      radial-gradient(circle at 62% 62%, rgba(135, 103, 73, .26) 0 9%, transparent 10%),
      radial-gradient(circle at 70% 27%, rgba(135, 103, 73, .2) 0 4%, transparent 5%),
      radial-gradient(circle at 38% 34%, #fff8e8, #ffd99b 55%, #d3a766 100%);
    box-shadow: 0 0 45px 10px rgba(255, 211, 138, .34), 0 0 110px 48px rgba(255, 120, 63, .11);
  }
  .cloud { position: absolute; z-index: 1; width: 230px; height: 45px; opacity: .48; pointer-events: none;
    background: radial-gradient(ellipse at 24% 68%, #18172a 0 25%, transparent 26%), radial-gradient(ellipse at 46% 40%, #18172a 0 34%, transparent 35%), radial-gradient(ellipse at 72% 62%, #18172a 0 29%, transparent 30%);
    filter: blur(2px); animation: cloud-drift 28s linear infinite; }
  .cloud.one { top: 72px; right: -120px; animation-duration: 31s; }
  .cloud.two { top: 120px; right: 42%; transform: scale(.76); opacity: .34; animation-duration: 39s; animation-direction: reverse; }
  @keyframes cloud-drift { from { translate: 0 0; } to { translate: -360px 6px; } }
  .horizon, .fence, .mist, .ground { position: absolute; left: 0; right: 0; pointer-events: none; }
  .horizon { bottom: 144px; height: 250px; z-index: 1; opacity: .83; }
  .horizon svg { width: 100%; height: 100%; display: block; }
  .fence { bottom: 106px; height: 76px; z-index: 2; opacity: .72; background: repeating-linear-gradient(90deg, transparent 0 34px, #110f1c 35px 38px, transparent 39px 62px); }
  .fence::before, .fence::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; background: #110f1c; }
  .fence::before { top: 29px; } .fence::after { top: 51px; }
  .mist { bottom: 82px; height: 160px; z-index: 3; overflow: hidden; opacity: .65; }
  .mist::before, .mist::after { content: ""; position: absolute; width: 160%; height: 100%; left: -30%; background: radial-gradient(ellipse at 15% 80%, rgba(153, 177, 202, .25) 0 12%, transparent 32%), radial-gradient(ellipse at 42% 72%, rgba(119, 143, 165, .18) 0 14%, transparent 34%), radial-gradient(ellipse at 75% 88%, rgba(184, 197, 211, .2) 0 12%, transparent 32%); filter: blur(9px); animation: mist-drift 30s ease-in-out infinite alternate; }
  .mist::after { opacity: .6; transform: scaleX(-1) translateY(26px); animation-duration: 43s; }
  @keyframes mist-drift { from { translate: -7% 0; } to { translate: 8% -8px; } }
  .flame { transform-box: fill-box; transform-origin: bottom center; animation: flame-flicker 1.35s ease-in-out infinite alternate; }
  .web { animation: web-sway 8s ease-in-out infinite alternate; transform-origin: top left; }
  @keyframes flame-flicker { from { transform: rotate(-4deg) scale(.87, 1.04); opacity: .72; } to { transform: rotate(5deg) scale(1.08, .92); opacity: 1; } }
  @keyframes web-sway { from { transform: rotate(-1deg); } to { transform: rotate(2deg); } }
  .bats { position: absolute; z-index: 2; top: 54px; right: clamp(40px, 10vw, 160px); width: 250px; height: 150px; pointer-events: none; overflow: visible; }
  .bat { transform-box: fill-box; transform-origin: center; animation: bat-flap .7s ease-in-out infinite alternate; }
  .bat.flight-a { animation: bat-fly-a 12s linear infinite, bat-flap .58s ease-in-out infinite alternate; }
  .bat.flight-b { animation: bat-fly-b 15s linear -6s infinite, bat-flap .74s ease-in-out infinite alternate; }
  @keyframes bat-flap { to { scale: 1 .64; } }
  @keyframes bat-fly-a { from { translate: 20px 52px; } to { translate: -220px 15px; } }
  @keyframes bat-fly-b { from { translate: 160px 8px; } to { translate: -130px 70px; } }
  .ground { bottom: 0; height: 430px; z-index: 3; background: linear-gradient(180deg, transparent 0 12%, rgba(24, 47, 36, .9) 29%, #17131a 68%, #0f0c11 100%); }
  .ground::before { content: ""; position: absolute; top: 77px; left: 0; right: 0; height: 28px; background: radial-gradient(15px 22px at 2% 100%, #244432 95%, transparent 100%) 0 0 / 48px 28px repeat-x; opacity: .92; }
  .entry { position: relative; overflow: hidden; border-color: #5a4756; background: linear-gradient(140deg, rgba(45, 39, 47, .96), rgba(21, 17, 28, .94)); box-shadow: inset 0 1px rgba(255, 225, 179, .08), 0 18px 42px rgba(0, 0, 0, .35); }
  .entry::before, .entry::after { content: ""; position: absolute; pointer-events: none; background: #796371; opacity: .32; }
  .entry::before { width: 1px; height: 90px; rotate: 38deg; right: 9%; top: -29px; } .entry::after { width: 72px; height: 1px; rotate: -18deg; left: -20px; bottom: 30px; }
  .entry textarea { background: rgba(10, 8, 13, .9); border-color: #655168; box-shadow: inset 0 1px 13px rgba(0, 0, 0, .45); }
  .btn.primary { background: linear-gradient(135deg, var(--pumpkin-hot), var(--pumpkin)); border-color: #f3a057; color: #24130f; box-shadow: 0 4px 16px rgba(255, 125, 54, .22); }
  .btn.primary:hover { background: #ffc178; }
  .summarybar, .detail { border-color: #5a485c; background: linear-gradient(145deg, rgba(37, 29, 42, .96), rgba(20, 16, 27, .96)); }
  .digbar { height: 9px; background: #211720; border: 1px solid #5d4451; }
  .digbar i { width: 28%; background: linear-gradient(90deg, transparent, var(--pumpkin), #ffe1a1, transparent); }
  .digbar i::after { content: "⚒"; position: absolute; margin-top: -19px; color: #ffe2ac; font-size: 21px; text-shadow: 0 0 12px var(--pumpkin); }
  .graveyard { position: relative; gap: 12px 12px; padding: 36px 20px 54px; margin: 0 -10px; border-radius: 22px; background: radial-gradient(ellipse at 50% 5%, rgba(247, 136, 63, .09), transparent 39%), linear-gradient(180deg, rgba(24, 48, 36, .16), rgba(13, 12, 16, .36)); }
  .graveyard::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .6; background-image: radial-gradient(circle at 9% 67%, rgba(130, 176, 126, .3) 0 1px, transparent 2px), radial-gradient(circle at 32% 37%, rgba(130, 176, 126, .3) 0 1px, transparent 2px); background-size: 93px 66px, 117px 88px; }
  .stone-btn { min-height: 192px; z-index: 1; transform: translateY(18px) scale(.96); }
  .stone-btn .svgwrap { width: 142px; transform: translateY(var(--rise, 0px)) rotate(var(--lean, 0deg)); transition: transform .2s ease, filter .2s ease; }
  .stone-btn svg { width: 142px; height: 166px; filter: drop-shadow(0 18px 13px rgba(0, 0, 0, .55)); overflow: visible; }
  .stone-btn .cap { position: absolute; top: calc(65px + var(--rise, 0px)); left: 50%; width: 92px; transform: translateX(-50%) rotate(var(--lean, 0deg)); margin: 0; font-family: Georgia, "Songti SC", serif; font-size: 12px; color: #e2d5c4; text-shadow: 0 2px 2px #000; line-height: 1.2; pointer-events: none; }
  .stone-btn .cap small { margin-top: 24px; color: #cabfb1; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 10.5px; text-shadow: 0 1px 2px #000; }
  .stone-btn.depth-back { opacity: .73; } .stone-btn.depth-back .svgwrap { scale: .83; transform-origin: bottom center; }
  .stone-btn.depth-back .cap { scale: .83; transform-origin: top center; }
  .stone-btn.depth-front { z-index: 2; } .stone-btn.depth-front .svgwrap { scale: 1.06; }
  .stone-btn:hover .svgwrap, .stone-btn:focus-visible .svgwrap { filter: drop-shadow(0 0 12px rgba(255, 187, 106, .55)); transform: translateY(calc(var(--rise, 0px) - 4px)) rotate(var(--lean, 0deg)) scale(1.035); }
  .stone-btn:hover .cap, .stone-btn:focus-visible .cap { color: #fff4db; }
  .stone-btn.status-alive .svgwrap { filter: drop-shadow(0 0 11px rgba(255, 142, 61, .28)) drop-shadow(0 18px 13px rgba(0,0,0,.55)); }
  .detail { box-shadow: 0 0 0 1px rgba(255, 166, 91, .13), 0 10px 36px rgba(255, 115, 48, .16), 0 20px 60px rgba(0,0,0,.6); }
  .detail h2 { font-family: Georgia, "Songti SC", serif; letter-spacing: .02em; }
  .legend i { display: none; } .legend b { margin-right: 4px; font-weight: 400; }
  .crowded .stone-btn svg .flame, .crowded .stone-btn svg .web, .crowded .stone-btn svg .twitch { animation: none !important; }
  body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after { animation: none !important; transition: none !important; }
  body.reduce-motion .stone-btn { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .stone-btn { opacity: 1; transform: none; } }
  @media (max-width: 720px) { .horizon { display: none; } .bats { scale: .68; transform-origin: right top; } .cloud.two { display: none; } .ground { height: 300px; } .graveyard { margin-left: -4px; margin-right: -4px; padding-left: 6px; padding-right: 6px; } .stone-btn .svgwrap, .stone-btn svg { width: 112px; } .stone-btn svg { height: 134px; } .stone-btn .cap { top: calc(54px + var(--rise, 0px)); width: 77px; font-size: 10px; } .stone-btn { min-height: 159px; } }
</style>

<div class="scene">
  <div class="stars" id="stars"></div>
  <div class="moon" aria-hidden="true"></div>
  <div class="cloud one" aria-hidden="true"></div>
  <div class="cloud two" aria-hidden="true"></div>
  <svg class="bats" viewBox="0 0 250 150" aria-hidden="true">

  </div>
  <div class="fence" aria-hidden="true"></div>
  <div class="mist" aria-hidden="true"></div>
  <div class="ground" aria-hidden="true"></div>

  <div class="wrap">
    <header class="top">
      <h1>Dependency Graveyard <span class="moss">· 依赖墓地</span></h1>
      <p class="sub">粘贴一段 package.json —— 你的依赖会变成一座墓地：谁活着，谁成了僵尸，谁是幽灵，谁已经入土。</p>
    </header>

    <section class="entry" aria-label="输入你的 package.json">
      <label for="pkg-input">把 <code>package.json</code> 的正文粘贴到这里（或直接用示例）：</label>
      <textarea id="pkg-input" spellcheck="false" placeholder='{\n  "name": "my-app",\n  "dependencies": { ... }\n}'></textarea>
      <div class="actions">
        <button class="btn primary" id="btn-submit" type="button" aria-label="分析 package.json 中的依赖">掘开坟墓</button>
        <button class="btn ghostb" id="btn-example" type="button">来点陪葬品</button>
        <button class="btn ghostb" id="btn-clear" type="button">清空</button>
      </div>
      <p class="hint">数据来自公开的 npm 注册表。这只是维护活跃度展示，不是安全审计。</p>
    </section>

    <div class="statusline" id="statusline" role="status" aria-live="polite"></div>

    <section class="summarybar" id="summarybar" hidden>
      <span class="big" id="sum-total"></span>
      <span class="legend" id="legend"></span>
    </section>

    <div class="digbar" id="digbar" aria-hidden="true"><i></i></div>

    <section class="toolbar" id="toolbar" hidden>
      <button class="filt on" data-filter="all" type="button">全部</button>
      <button class="filt" data-filter="alive" type="button">活着</button>
      <button class="filt" data-filter="zombie" type="button">僵尸</button>
      <button class="filt" data-filter="ghost" type="button">幽灵</button>
      <button class="filt" data-filter="dead" type="button">已死</button>
      <span class="spacer"></span>
      <button class="toggle" id="toggle-table" type="button">表格视图</button>
      <button class="toggle" id="toggle-motion" type="button">减少动效</button>
    </section>

    <div id="graveyard" class="graveyard" role="list" aria-label="墓地：每块墓碑是一个依赖" tabindex="0"></div>

    <table class="tableview" id="tableview" aria-label="依赖清单表格">
      <thead>
        <tr><th>依赖</th><th>类型</th><th>状态</th><th>最后发布</th><th>近一周下载</th><th>说明</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div class="empty" id="empty">
      <svg viewBox="0 0 64 76" aria-hidden="true"><path d="M10 72V28a22 22 0 0 1 44 0v44z" fill="#17121f" stroke="#4a3d5e" stroke-width="2"/><path d="M24 24h16M32 24v26" stroke="#5a4d74" stroke-width="3" stroke-linecap="round"/></svg>
      <div class="big">这里还很安静。</div>
      <div>还没有任何依赖。粘贴你的 package.json，或点上方「用示例试试」。</div>
    </div>

    <footer class="foot">Dependency Graveyard · 维护活跃度可视化。数据来自 npm 公开接口。</footer>
  </div>
</div>

<!-- 详情面板 -->
<div class="overlay" id="overlay">
  <div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <h2 id="detail-title"></h2>
    <div class="ver" id="detail-range"></div>
    <p class="epi" id="detail-epi"></p>
    <dl id="detail-dl"></dl>
    <div class="foot">
      <a class="btn" id="detail-link" target="_blank" rel="noopener noreferrer">在 npm 查看</a>
      <a class="btn" id="detail-alt" target="_blank" rel="noopener noreferrer">查找替代</a>
      <button class="btn primary close" id="detail-close" type="button">关闭 (Esc)</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ===================== 工具 ===================== */
  var $ = function (id) { return document.getElementById(id); };

  /* ===================== 示例数据 ===================== */
  var EXAMPLE = JSON.stringify({
    name: 'demo-app',
    version: '1.0.0',
    dependencies: {
      'react': '^18.2.0',
      'react-dom': '^18.2.0',
      'axios': '^1.6.8',
      'lodash': '^4.17.21',
      'ms': '^2.1.3',
      'chalk': '^4.1.2',
      'express': '^4.19.2',
      'request': '^2.88.2',
      'gulp': '^4.0.2',
      'coffee-script': '^1.12.7',
      'bower': '^1.8.14'
    },
    devDependencies: {
      'typescript': '^5.4.5',
      'jest': '^29.7.0',
      'grunt': '^1.6.1',
      'karma': '^6.4.4'
    }
  }, null, 2);

  /* ===================== 状态元信息与文案 ===================== */
  var STATUS_META = {
    alive:  { label: '活着', color: 'var(--alive)', cls: 'alive' },
    zombie: { label: '僵尸', color: 'var(--zombie)', cls: 'zombie' },
    ghost:  { label: '幽灵', color: 'var(--ghost)', cls: 'ghost' },
    dead:   { label: '已死', color: 'var(--dead)', cls: 'dead' }
  };
  var EPITAPHS = {
    alive:   '这座碑还亮着灯。最近 12 个月仍有人发布，可以放心使用。',
    zombie:  '它仍在被许多人使用，却已经很久没人维护了。',
    ghost:   '官方已在 npm 上把它标记为 deprecated，正在缓缓退场。',
    dead:    '久无更新，也少有人问津。愿它安息。',
    local:   '这是本地 / 私有依赖，无法在 npm 注册表里探访，静静立着。',
    error:   '它的墓碑破碎了——无法从 npm 读取数据。请检查网络，或稍后再试。',
    notfound:'在 npm 注册表里找不到这个名字。它或许已被移除，或是私有包。'
  };

  /* ===================== 解析 package.json ===================== */
  function isNonRegistryRange(range) {
    if (typeof range !== 'string' || range.trim() === '') return true;
    var r = range.trim();
    if (/^(workspace:|file:|link:|npm:)/.test(r)) return true;
    if (/^git(\+|:)/.test(r)) return true;
    if (/^(http|ftp)s?:/.test(r)) return true;
    if (/^\.{0,2}\//.test(r)) return true;
    return false;
  }

  // npm: 别名 → 真实包名（npm:other@1 → other，npm:@scope/name@1 → @scope/name）
  function aliasedName(range) {
    var s = range.trim();
    if (!/^npm:/.test(s)) return null;
    var body = s.slice(4);
    var at = body.lastIndexOf('@');
    if (at <= 0) return body;
    return body.slice(0, at);
  }

  function parsePackageJson(text) {
    var obj = JSON.parse(text);
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) {
      throw new Error('这不是一个 JSON 对象');
    }
    var deps = obj.dependencies;
    var devDeps = obj.devDependencies;
    if (deps != null && (typeof deps !== 'object' || Array.isArray(deps))) throw new Error('dependencies 不是对象');
    if (devDeps != null && (typeof devDeps !== 'object' || Array.isArray(devDeps))) throw new Error('devDependencies 不是对象');
    deps = deps || {}; devDeps = devDeps || {};
    if (Object.keys(deps).length + Object.keys(devDeps).length === 0) {
      throw new Error('没有发现任何依赖');
    }

    var map = {};
    function add(name, range, kind) {
      name = String(name);
      if (!name) return;
      var prev = map[name];
      // 同名出现在两者中：保留 dependency
      if (prev && prev.kind === 'dependency') return;
      map[name] = { name: name, range: String(range), kind: kind };
    }
    Object.keys(deps).forEach(function (k) { add(k, deps[k], 'dependency'); });
    Object.keys(devDeps).forEach(function (k) { add(k, devDeps[k], 'devDependency'); });

    return Object.keys(map).map(function (k) { return map[k]; });
  }

  /* ===================== 状态判定（纯函数） ===================== */
  var ZOMBIE_DL = 100000;                       // 僵尸下载量阈值

  function monthsSince(lastPublishTime) {
    if (!lastPublishTime) return Infinity;
    var t = new Date(lastPublishTime).getTime();
    return isNaN(t) ? Infinity : (Date.now() - t) / (30.4375 * 24 * 3600 * 1000);
  }

  // 幽灵(最高优先) > 12个月内发布(活着) > 超12个月但周下载≥10万(僵尸) > 其余(已死)
  function classify(dep) {
    if (dep.deprecated) return 'ghost';
    if (monthsSince(dep.lastPublishTime) <= 12) return 'alive';
    if (dep.weeklyDownloads >= ZOMBIE_DL) return 'zombie';
    return 'dead';
  }

  /* ===================== npm 数据拉取 ===================== */
  function registryUrl(name) { return 'https://registry.npmjs.org/' + name.replace('/', '%2F'); }
  function downloadsUrl(name) { return 'https://api.npmjs.org/downloads/point/last-week/' + name; }

  async function fetchPackageHealth(name, signal) {
    var res = await fetch(registryUrl(name), { signal: signal });
    if (res.status === 404) return { name: name, notFound: true };
    if (!res.ok) return { name: name, httpError: res.status };
    var data = await res.json();

    var latest = data && data['dist-tags'] && data['dist-tags'].latest;
    var time = (data && data.time) || {};
    var lastPublishTime = latest ? (time[latest] || time.modified || null) : (time.modified || null);

    var deprecated = null;
    if (latest && data.versions && data.versions[latest]) {
      deprecated = data.versions[latest].deprecated || null;
    }

    var weeklyDownloads = 0;
    try {
      var dl = await fetch(downloadsUrl(name), { signal: signal });
      if (dl.ok) {
        var d = await dl.json();
        weeklyDownloads = Number(d.downloads) || 0;
      }
    } catch (e) { /* 下载量失败时按 0 处理，不影响状态 */ }

    return { name: name, lastPublishTime: lastPublishTime, weeklyDownloads: weeklyDownloads, deprecated: deprecated };
  }

  async function runConcurrent(items, limit, worker, onResult) {
    var i = 0;
    var n = Math.min(limit, items.length);
    async function workerFn() {
      while (i < items.length) {
        var idx = i++;
        var out;
        try { out = await worker(items[idx]); }
        catch (e) { out = { name: items[idx].name, error: e }; }
        if (out !== undefined) onResult(out, idx);
      }
    }
    var jobs = [];
    for (var w = 0; w < n; w++) jobs.push(workerFn());
    await Promise.all(jobs);
  }

  /* ===================== 运行时状态 ===================== */
  var state = {
    batch: 0,           // 批次 key，防竞态
    results: {},
    filter: 'all',
    view: 'grid',
    controller: null,
    reducedMotion: false
  };
  var ALL_DEP_ORDER = [];

  /* ===================== SVG 墓碑 ===================== */
  function stableHash(value) {
    var hash = 2166136261;
    for (var i = 0; i < value.length; i++) {
      hash ^= value.charCodeAt(i);
      hash = Math.imul(hash, 16777619);
    }
    return hash >>> 0;
  }

  function stoneVariant(name) {
    var hash = stableHash(name);
    return {
      shape: hash % 3,
      lean: (hash % 9) - 4,
      rise: ((hash >>> 4) % 13) - 6,
      depth: (hash >>> 9) % 3
    };
  }

  function stoneSVG(status, variant) {
    var common = 'viewBox="0 0 80 96" aria-hidden="true"';
    switch (status) {
      case 'alive':
        return '<svg ' + common + '><ellipse cx="40" cy="88" rx="31" ry="5" fill="#090b0c" opacity=".62"/><path d="' + (variant === 1 ? 'M17 87V34h46V87z' : 'M17 87V34a23 23 0 0 1 46 0V87z') + '" fill="#30283b" stroke="#bca4a0" stroke-width="2.4"/><path d="M25 87V39h30v48" fill="none" stroke="#55475d" stroke-width="1.5"/><path d="M10 87h60" stroke="#79615d" stroke-width="4" stroke-linecap="round"/><path d="M60 77v-17a6 6 0 0 0-12 0v17z" fill="#5c3d2c" stroke="#ffc26e" stroke-width="1.5"/><circle cx="54" cy="65" r="5" fill="#ff9b42" class="glow"/><path d="M54 66c-3-4 0-8 1-11 4 5 4 8 0 11z" fill="#ffe1a1" class="flame"/></svg>';
      case 'zombie':
        return '<svg ' + common + '><ellipse cx="40" cy="88" rx="31" ry="5" fill="#090b0c" opacity=".66"/><path d="M16 87V35a24 24 0 0 1 48 0v52z" fill="#273027" stroke="#91bf6e" stroke-width="2.6"/><path d="M38 17v51m-14-16 14 16 14-27" stroke="#566455" stroke-width="2" fill="none"/><path d="M20 79c-2-12 2-22 6-27m3 34c-2-16 5-27 10-31" stroke="#6d9f59" stroke-width="3.4" fill="none" stroke-linecap="round"/><path class="twitch" d="M48 88c-2-13 2-19 5-25 2-4 6-2 5 2 3-4 6-1 4 3 5-2 6 3 1 5 3 3 0 7-4 4l-3 11" fill="#779b67" stroke="#b9d38d" stroke-width="1.4"/></svg>';
      case 'ghost':
        return '<svg ' + common + '><ellipse cx="40" cy="88" rx="28" ry="5" fill="#081020" opacity=".58"/><path class="floaty" d="M17 73V38a23 23 0 0 1 46 0v35l-8-7-8 8-8-8-8 8-7-7z" fill="#79b9ff" opacity=".29" stroke="#acd2ff" stroke-width="2.3" stroke-dasharray="4 3"/><path d="M23 70c12 6 26 6 35 0" fill="none" stroke="#b5dcff" opacity=".45"/><circle cx="32" cy="42" r="3.8" fill="#c7e6ff"/><circle cx="49" cy="42" r="3.8" fill="#c7e6ff"/><path d="M25 78c9 8 24 8 34 0" fill="none" stroke="#6b9bde" opacity=".35" stroke-width="5" stroke-linecap="round"/></svg>';
      default:
        return '<svg ' + common + '><ellipse cx="40" cy="88" rx="34" ry="5" fill="#090b0c" opacity=".7"/><g transform="rotate(' + (variant === 1 ? '-8 40 68' : variant === 2 ? '7 40 68' : '-3 40 68') + ')"><path d="M17 87V35a23 23 0 0 1 46 0v52z" fill="#28242b" stroke="#938697" stroke-width="2.4"/><path d="M27 28h26m-13 0v30" stroke="#a79aa8" stroke-width="2.6" stroke-linecap="round"/><path d="M18 86h45" stroke="#716473" stroke-width="4" stroke-linecap="round"/><path class="web" d="M18 36c9 0 16 7 16 17m-16-9 16 9m-9-17v17" fill="none" stroke="#b3a4bc" opacity=".55" stroke-width=".8"/><path d="M55 25c6-6 12-2 9 3 6 0 7 8 0 8-4 0-8-2-10-5z" fill="#111016"/><circle cx="61" cy="28" r=".8" fill="#ffbd62"/></g><path d="M12 88c10-5 45-5 57 0" fill="none" stroke="#536a48" stroke-width="2" stroke-linecap="round"/></svg>';
    }
  }

  function fmtNum(n) {
    if (n == null || isNaN(n)) return '—';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
    return String(n);
  }

  function metaLine(res) {
    if (!res) return '';
    if (res.local) return '本地';
    if (res.notFound) return '未找到';
    if (res.httpError || res.status === 'error') return '读取失败';
    var m = STATUS_META[res.status];
    if (!m) return '';
    if (res.status === 'alive' && res.lastPublishTime) {
      var d = new Date(res.lastPublishTime);
      return m.label + ' · ' + d.getFullYear() + '年' + (d.getMonth() + 1) + '月发布';
    }
    if (res.status === 'zombie') return m.label + ' · ' + fmtNum(res.weeklyDownloads) + '/周';
    if (res.status === 'dead') return m.label + ' · 长眠';
    return m.label;
  }

  function buildStone(dep) {
    var res = state.results[dep.name] || {};
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'stone-btn';
    btn.setAttribute('role', 'listitem');
    btn.dataset.name = dep.name;

    var local = !!res.local;
    var isErr = !!(res.notFound || res.httpError || res.status === 'error');
    var showStatus = local ? 'dead' : (isErr ? 'dead' : (res.status || 'dead'));
    var visual = stoneVariant(dep.name);
    var depthClass = visual.depth === 0 ? 'depth-back' : (visual.depth === 2 ? 'depth-front' : 'depth-mid');
    btn.classList.add('status-' + showStatus, depthClass);
    btn.style.setProperty('--lean', visual.lean + 'deg');
    btn.style.setProperty('--rise', visual.rise + 'px');

    var aria;
    if (local) aria = dep.name + '，本地或私有依赖，未查询 npm。';
    else if (isErr) aria = dep.name + '，' + (res.notFound ? '注册表中未找到' : '读取失败');
    else {
      var m = STATUS_META[res.status] || STATUS_META.dead;
      var when = res.lastPublishTime ? new Date(res.lastPublishTime).toLocaleDateString('zh-CN', { year: 'numeric', month: 'short' }) : '未知';
      aria = dep.name + '，' + m.label + '，最后发布于 ' + when;
    }
    btn.setAttribute('aria-label', aria);

    var svgWrap = document.createElement('span');
    svgWrap.className = 'svgwrap';
    svgWrap.innerHTML = stoneSVG(showStatus, visual.shape);

    var cap = document.createElement('span');
    cap.className = 'cap';
    cap.textContent = dep.name;
    var small = document.createElement('small');
    small.textContent = metaLine(res);
    cap.appendChild(small);

    btn.appendChild(svgWrap);
    btn.appendChild(cap);
    btn.addEventListener('click', function () { openDetail(dep); });
    return btn;
  }

  /* ===================== 汇总 ===================== */
  function renderSummary() {
    var counts = { alive: 0, zombie: 0, ghost: 0, dead: 0, local: 0, error: 0 };
    ALL_DEP_ORDER.forEach(function (dep) {
      var r = state.results[dep.name];
      if (!r) return;
      if (r.local) counts.local++;
      else if (r.status === 'alive' || r.status === 'zombie' || r.status === 'ghost' || r.status === 'dead') counts[r.status]++;
      else counts.error++;
    });
    var total = ALL_DEP_ORDER.length;
    var bar = $('summarybar'), tb = $('toolbar');
    if (total === 0) { bar.hidden = true; tb.hidden = true; return; }
    bar.hidden = false; tb.hidden = false;
    $('sum-total').textContent = total + ' 个依赖';

    var order = [['alive', '🕯', '活着'], ['zombie', '✋', '僵尸'], ['ghost', '◌', '幽灵'], ['dead', '†', '已死'], ['local', '⌂', '本地'], ['error', '⚠', '异常']];
    var html = '';
    order.forEach(function (o) {
      html += '<span style="white-space:nowrap"><b aria-hidden="true">' + o[1] + '</b>' + o[2] + ' ' + (counts[o[0]] || 0) + '</span>';
    });
    $('legend').innerHTML = html;
  }

  /* ===================== 筛选判定 ===================== */
  function filterPass(dep, res) {
    var f = state.filter;
    if (f === 'all') return true;
    if (f === 'local') return !!res.local;
    if (f === 'error') return !!(res.notFound || res.httpError || res.status === 'error');
    return res.status === f;
  }

  /* ===================== 墓地渲染 ===================== */
  function renderGraveyard() {
    var g = $('graveyard');
    g.innerHTML = '';
    var shown = 0;
    ALL_DEP_ORDER.forEach(function (dep, idx) {
      var res = state.results[dep.name];
      if (!res || !filterPass(dep, res)) return;
      var stone = buildStone(dep);
      stone.style.animationDelay = (Math.min(shown, 24) * 0.05) + 's';
      g.appendChild(stone);
      shown++;
    });

    var empty = $('empty');
    if (ALL_DEP_ORDER.length === 0) {
      empty.hidden = false;
      empty.querySelector('.big').textContent = '这里还很安静。';
      empty.querySelectorAll('div')[1].textContent = '还没有任何依赖。粘贴你的 package.json，或点上方「用示例试试」。';
    } else if (shown === 0) {
      empty.hidden = false;
      empty.querySelector('.big').textContent = '这里什么都没有……';
      empty.querySelectorAll('div')[1].textContent = '没有符合当前筛选的墓碑。';
    } else {
      empty.hidden = true;
    }
  }

  /* ===================== 表格渲染 ===================== */
  function renderTable() {
    var tb = $('tbody');
    tb.innerHTML = '';
    ALL_DEP_ORDER.forEach(function (dep) {
      var res = state.results[dep.name];
      if (!res || !filterPass(dep, res)) return;
      var tr = document.createElement('tr');
      var c = function (text) { var td = document.createElement('td'); td.textContent = text; return td; };
      tr.appendChild(c(dep.name));
      tr.appendChild(c(dep.kind === 'dependency' ? 'dependencies' : 'devDependencies'));

      var tdSt = document.createElement('td');
      var chip = document.createElement('span'); chip.className = 'chip st';
      if (res.local) { chip.textContent = '本地/私有'; chip.classList.add('local'); }
      else if (res.notFound) { chip.textContent = '未找到'; chip.classList.add('err'); }
      else if (res.httpError || res.status === 'error') { chip.textContent = '读取失败'; chip.classList.add('err'); }
      else { var m = STATUS_META[res.status] || STATUS_META.dead; chip.textContent = m.label; chip.style.color = m.color; }
      tdSt.appendChild(chip);

      tr.appendChild(tdSt);
      tr.appendChild(c(res.lastPublishTime ? new Date(res.lastPublishTime).toLocaleDateString('zh-CN') : '—'));
      tr.appendChild(c(res.weeklyDownloads != null ? fmtNum(res.weeklyDownloads) : '—'));
      tr.appendChild(c(res.deprecated ? truncate(res.deprecated, 40) : (res.local ? '未查询 npm' : '')));
      tb.appendChild(tr);
    });
  }

  function truncate(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  /* ===================== 详情面板 ===================== */
  function openDetail(dep) {
    var res = state.results[dep.name] || {};
    var title = $('detail-title');
    var range = $('detail-range');
    var epi = $('detail-epi');
    var dl = $('detail-dl');
    var link = $('detail-link');
    var alt = $('detail-alt');
    var pkg = dep.name;

    title.textContent = dep.name;
    title.style.color = '';
    range.textContent = '范围 ' + dep.range + (dep.kind === 'dependency' ? ' · dependencies' : ' · devDependencies');
    dl.innerHTML = '';

    function row(dt, dd, cls) {
      var div = document.createElement('div');
      var d1 = document.createElement('dt'); d1.textContent = dt;
      var d2 = document.createElement('dd'); d2.textContent = dd;
      if (cls) d2.className = cls;
      div.appendChild(d1); div.appendChild(d2); dl.appendChild(div);
    }

    if (res.local) {
      epi.textContent = EPITAPHS.local;
      row('类型', '本地 / 私有');
      link.style.display = 'none'; alt.style.display = 'none';
    } else if (res.notFound) {
      epi.textContent = EPITAPHS.notfound;
      row('状态', '注册表中未找到');
      link.style.display = 'inline-block'; alt.style.display = 'inline-block';
    } else if (res.httpError || res.status === 'error') {
      epi.textContent = EPITAPHS.error;
      row('状态', '读取失败' + (res.httpError ? ' (HTTP ' + res.httpError + ')' : ''));
      link.style.display = 'inline-block'; alt.style.display = 'inline-block';
    } else {
      var m = STATUS_META[res.status] || STATUS_META.dead;
      title.style.color = m.color;
      epi.textContent = EPITAPHS[res.status];
      row('状态', m.label);
      row('最后发布', res.lastPublishTime ? new Date(res.lastPublishTime).toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' }) : '尚未发布');
      row('近一周下载', res.weeklyDownloads != null ? fmtNum(res.weeklyDownloads) : '—');
      if (res.deprecated) row('deprecated', truncate(res.deprecated, 60), 'mute');
      row('备注', '这只是维护活跃度，不是安全审计。', 'mute');
      link.style.display = 'inline-block'; alt.style.display = 'inline-block';
    }

    link.href = 'https://www.npmjs.com/package/' + encodeURIComponent(pkg);
    alt.href = 'https://www.npmjs.com/search?q=' + encodeURIComponent(pkg);
    $('overlay').classList.add('open');
    $('detail-close').focus();
  }

  function closeDetail() { $('overlay').classList.remove('open'); }

  /* ===================== 主流程 ===================== */
  async function run(input) {
    var parsed;
    try { parsed = parsePackageJson(input); }
    catch (e) {
      $('statusline').textContent = '⛏ 解析失败：' + e.message + '。你的输入仍在框里，请修改后重试。';
      return;
    }
    if (input.length > 1024 * 1024) {
      $('statusline').textContent = '输入超过 1MB，本工具拒绝处理以免卡顿。请精简。';
      return;
    }

    var batch = ++state.batch;
    if (state.controller) state.controller.abort();
    var controller = new AbortController();
    state.controller = controller;

    ALL_DEP_ORDER = parsed;
    document.body.classList.toggle('crowded', parsed.length > 60);
    state.results = {};
    state.filter = 'all';
    syncFilterUI();

    // 预标记本地依赖，并记录别名
    parsed.forEach(function (dep) {
      var alias = aliasedName(dep.range);
      if (alias) dep.queryName = alias;
      if (isNonRegistryRange(dep.range) && !alias) {
        state.results[dep.name] = { name: dep.name, local: true };
      }
    });

    $('statusline').textContent = '解析出 ' + parsed.length + ' 个依赖，开始挖坟……';
    $('digbar').classList.add('show');
    $('summarybar').hidden = true;
    $('toolbar').hidden = true;
    renderGraveyard();
    renderTable();
    renderSummary();

    var registryDeps = parsed.filter(function (d) { return !state.results[d.name]; });

    try {
      await runConcurrent(registryDeps, 6, async function (dep) {
        if (controller.signal.aborted) return undefined;
        var queryName = dep.queryName || dep.name;
        return await fetchPackageHealth(queryName, controller.signal);
      }, function (out) {
        if (batch !== state.batch || !out) return;
        var target = ALL_DEP_ORDER.find(function (d) { return (d.queryName || d.name) === out.name; }) ||
                     ALL_DEP_ORDER.find(function (d) { return d.name === out.name; });
        if (!target) return;
        var res = out;
        if (res.notFound) res.status = 'notfound';
        else if (res.httpError) res.status = 'error';
        else if (res.error) res.status = 'error';
        else res.status = classify(res);
        state.results[target.name] = res;
        renderGraveyard();
        renderTable();
        renderSummary();
      });

      if (batch === state.batch) {
        $('statusline').textContent = '探访完成。' + parsed.length + ' 个依赖已落土。';
        $('digbar').classList.remove('show');
        renderGraveyard();
        renderTable();
        renderSummary();
      }
    } catch (e) {
      if (controller.signal.aborted) {
        $('statusline').textContent = '已取消上一次探访。';
      } else {
        $('statusline').textContent = '出现网络错误：' + (e && e.message || e);
      }
      $('digbar').classList.remove('show');
    }
  }

  function syncFilterUI() {
    document.querySelectorAll('.filt').forEach(function (f) {
      f.classList.toggle('on', f.dataset.filter === state.filter);
    });
  }

  /* ===================== 键盘导航 ===================== */
  $('graveyard').addEventListener('keydown', function (e) {
    var stones = Array.prototype.slice.call(this.querySelectorAll('.stone-btn'));
    var idx = stones.indexOf(document.activeElement);
    var dir = null;
    if (e.key === 'ArrowRight') dir = 1;
    else if (e.key === 'ArrowLeft') dir = -1;
    else if (e.key === 'ArrowDown') dir = Math.ceil(Math.sqrt(stones.length));
    else if (e.key === 'ArrowUp') dir = -Math.ceil(Math.sqrt(stones.length));
    if (dir === null || idx === -1) return;
    e.preventDefault();
    var next = Math.min(Math.max(idx + dir, 0), stones.length - 1);
    stones[next].focus();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('overlay').classList.contains('open')) closeDetail();
  });
  $('detail-close').addEventListener('click', closeDetail);
  $('overlay').addEventListener('click', function (e) { if (e.target === this) closeDetail(); });

  /* ===================== 工具栏事件 ===================== */
  document.querySelectorAll('.filt').forEach(function (f) {
    f.addEventListener('click', function () {
      state.filter = f.dataset.filter;
      syncFilterUI();
      renderGraveyard();
      renderTable();
    });
  });

  $('toggle-table').addEventListener('click', function () {
    state.view = state.view === 'table' ? 'grid' : 'table';
    this.classList.toggle('on', state.view === 'table');
    $('graveyard').classList.toggle('hide', state.view === 'table');
    $('tableview').classList.toggle('show', state.view === 'table');
    if (state.view === 'table') renderTable();
  });

  $('toggle-motion').addEventListener('click', function () {
    state.reducedMotion = !state.reducedMotion;
    document.body.classList.toggle('reduce-motion', state.reducedMotion);
    this.classList.toggle('on', state.reducedMotion);
  });

  /* ===================== 星星 ===================== */
  function paintStars() {
    var host = $('stars');
    host.innerHTML = '';
    for (var i = 0; i < 60; i++) {
      var s = document.createElement('span');
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (Math.random() * 55) + '%';
      s.style.animationDelay = (Math.random() * 5) + 's';
      s.style.animationDuration = (4 + Math.random() * 4) + 's';
      host.appendChild(s);
    }
  }

  /* ===================== 输入事件 ===================== */
  $('btn-example').addEventListener('click', function () { $('pkg-input').value = EXAMPLE; $('pkg-input').focus(); });
  $('btn-clear').addEventListener('click', function () { $('pkg-input').value = ''; $('pkg-input').focus(); });
  $('btn-submit').addEventListener('click', function () { run($('pkg-input').value); });

  /* ===================== 初始化 ===================== */
  paintStars();
  renderGraveyard();
})();
</script>
</body>
</html>
